name: Release

on:
  push:
    branches: [ main ]
permissions:
  contents: write

jobs:
  build_and_publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          Set-Location build\Release
          $zip = Join-Path $env:GITHUB_WORKSPACE "SSP-Release.zip"
          Compress-Archive -Path SSP.exe,data -DestinationPath $zip -Force
          Write-Output "zip=$zip" >> $env:GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('release-{0}', github.run_number) }}
          files: SSP-Release.zip
          generate_release_notes: true
