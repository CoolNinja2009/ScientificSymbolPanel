name: Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build_and_publish:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg vcpkg

      - name: Bootstrap and install vcpkg dependencies
        shell: pwsh
        run: |
          Set-Location vcpkg
          .\bootstrap-vcpkg.bat
          .\vcpkg.exe install --triplet x64-windows

      - name: Configure CMake
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          Set-Location build
          cmake -A x64 .. -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake

      - name: Build Release
        shell: pwsh
        run: |
          Set-Location build
          cmake --build . --config Release

      - name: Package release artifact
        shell: pwsh
        run: |
          Set-Location build\Release
          $zip = Join-Path $env:GITHUB_WORKSPACE "SSP-${{ github.run_number }}.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path * -DestinationPath $zip
          Write-Output "Built release archive: $zip"

      - name: Create GitHub release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: release-${{ github.run_number }}
          release_name: Release ${{ github.run_number }}
          body: "Automated release for commit ${{ github.sha }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ github.workspace }}\SSP-${{ github.run_number }}.zip
          asset_name: SSP-${{ github.run_number }}.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
